name: Release

# Builds release binaries when a version tag is pushed and attaches them to a
# GitHub release. Tag pattern: v<version> (e.g. v0.1.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            best-effort: false
          # GitHub retired Intel macOS runners; cross-compile x86_64 from arm64.
          - os: macos-latest
            label: macos-x86_64
            target: x86_64-apple-darwin
            best-effort: false
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            best-effort: false
          # Upstream calls Windows builds best-effort from this tree.
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            best-effort: true
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rustup reads rust-toolchain.toml and installs the pinned toolchain on
      # first use; just make sure the target is present.
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release -p xai-grok-pager-bin --target ${{ matrix.target }}

      # Windows: link.exe still produces a PDB and hits its public-symbol
      # limit on this workspace (LNK4319), so disable PDB generation outright.
      # RUSTFLAGS replaces .cargo/config.toml's target rustflags, so the
      # config flags (crt-static, unwind tables) are repeated here.
      - name: Build (windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C force-unwind-tables=yes -C target-feature=+crt-static -C link-arg=/DEBUG:NONE"
        run: cargo build --release -p xai-grok-pager-bin --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="your-own-ai-build-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/your-own-ai-build" "dist/${NAME}/"
          cp LICENSE THIRD-PARTY-NOTICES "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $name = "your-own-ai-build-$version-${{ matrix.label }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/your-own-ai-build.exe" "dist/$name/"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
